name: Montar pacote
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar zip
        run: zip -r MinhaTextura-1.21.1.zip pack.mcmeta pack.png assets -x "*.gitkeep" || zip -r MinhaTextura-1.21.1.zip pack.mcmeta assets -x "*.gitkeep"
      - name: Publicar versão mais nova
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Versão mais nova
          body: "Montado automaticamente a partir do commit ${{ github.sha }}"
          files: MinhaTextura-1.21.1.zip
          make_latest: true
